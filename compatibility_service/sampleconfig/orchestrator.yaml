# SPDX-License-Identifier: Apache-2.0

channel-id: channelqc4
protocol: fabric-x
wait-after-submit: 0s
request-timeout: 45s
finality-timeout: 20s

# Client proposal trust is separate from the TLS connection's CA roots.
proposal-auth:
  msps:
    - msp-id: org-0
      msp-dir: ../artifacts/peerOrganizations/peer-org-0/msp
    - msp-id: org-1
      msp-dir: ../artifacts/peerOrganizations/peer-org-1/msp
  rules:
    - chaincode: "*"
      namespace: "*"
      policy: "OR('org-0.member','org-1.member')"

server:
  endpoint:
    host: 127.0.0.1
    port: 9102
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.key
    ca-cert-paths:
      - ../artifacts/peerOrganizations/peer-org-0/tlsca/tlsca.peer-org-0-cert.pem
      - ../artifacts/peerOrganizations/peer-org-1/tlsca/tlsca.peer-org-1-cert.pem

# This instance has its own peer enrollment and TLS identities.
identity:
  msp-id: org-0
  msp-dir: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/msp

query-service:
  endpoint:
    host: 127.0.0.1
    port: 7001
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.key
    ca-cert-paths:
      - ../artifacts/peerOrganizations/peer-org-0/msp/tlscacerts/tlsca.peer-org-0-cert.pem
    server-name: 127.0.0.1

# Static CCAAS resolution example:
# chaincode-resolver:
#   static:
#     - msp-id: org-0
#       name: sample
#       version: "1.0"
#       address: 127.0.0.1:9999
#       tls:
#         mode: none
chaincode-resolver:
  static:
    - msp-id: org-0
      name: asset-transfer
      version: "1.0"
      address: 127.0.0.1:10001
      tls:
        mode: none
  dynamic:
    endpoint:
      host: 127.0.0.1
      port: 9300
    tls:
      mode: mtls
      cert-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.crt
      key-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.key
      ca-cert-paths:
        - ../artifacts/peerOrganizations/peer-org-0/tlsca/tlsca.peer-org-0-cert.pem
      server-name: 127.0.0.1

orderer:
  endpoint:
    host: 127.0.0.1
    port: 6022
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.key
    ca-cert-paths:
      - ../artifacts/ordererOrganizations/orderer-org-1/msp/tlscacerts/tlsca.orderer-org-1-cert.pem
    server-name: 127.0.0.1

notification-service:
  endpoint:
    host: 127.0.0.1
    port: 4001
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.key
    ca-cert-paths:
      - ../artifacts/peerOrganizations/peer-org-0/msp/tlscacerts/tlsca.peer-org-0-cert.pem
    server-name: 127.0.0.1

remote-orchestrator-resolver:
  static:
    - msp-id: org-1
      endpoint:
        host: 127.0.0.1
        port: 9202
      tls:
        mode: mtls
        cert-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.crt
        key-path: ../artifacts/peerOrganizations/peer-org-0/peers/orchestrator0.peer-org-0/tls/server.key
        ca-cert-paths:
          - ../artifacts/peerOrganizations/peer-org-1/tlsca/tlsca.peer-org-1-cert.pem
        server-name: 127.0.0.1
