# SPDX-License-Identifier: Apache-2.0

channel-id: channelqc4
protocol: fabric-x
wait-after-submit: 0s
request-timeout: 45s
finality-timeout: 20s

# A remote endorser verifies the original client, independently of its TLS caller.
proposal-auth:
  msps:
    - msp-id: org-0
      msp-dir: ../artifacts/peerOrganizations/peer-org-0/msp
    - msp-id: org-1
      msp-dir: ../artifacts/peerOrganizations/peer-org-1/msp
  rules:
    - chaincode: "*"
      namespace: "*"
      policy: "OR('org-0.member','org-1.member')"

server:
  endpoint:
    host: 127.0.0.1
    port: 9202
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
    ca-cert-paths:
      - ../artifacts/peerOrganizations/peer-org-0/tlsca/tlsca.peer-org-0-cert.pem
      - ../artifacts/peerOrganizations/peer-org-1/tlsca/tlsca.peer-org-1-cert.pem

# This instance has its own peer enrollment and TLS identities.
identity:
  msp-id: org-1
  msp-dir: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/msp

query-service:
  endpoint:
    host: 127.0.0.1
    port: 7001
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
    ca-cert-paths:
      - ../artifacts/peerOrganizations/peer-org-0/msp/tlscacerts/tlsca.peer-org-0-cert.pem
    server-name: 127.0.0.1

chaincode-resolver:
  static:
    - msp-id: org-1
      name: asset-transfer
      version: "1.0"
      address: 127.0.0.1:10002
      tls:
        mode: none
  dynamic:
    endpoint:
      host: 127.0.0.1
      port: 9300
    tls:
      mode: mtls
      cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
      key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
      ca-cert-paths:
        - ../artifacts/peerOrganizations/peer-org-0/tlsca/tlsca.peer-org-0-cert.pem
      server-name: 127.0.0.1

orderer:
  endpoint:
    host: 127.0.0.1
    port: 6022
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
    ca-cert-paths:
      - ../artifacts/ordererOrganizations/orderer-org-1/msp/tlscacerts/tlsca.orderer-org-1-cert.pem
    server-name: 127.0.0.1

notification-service:
  endpoint:
    host: 127.0.0.1
    port: 4001
  tls:
    mode: mtls
    cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
    key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
    ca-cert-paths:
      - ../artifacts/peerOrganizations/peer-org-0/msp/tlscacerts/tlsca.peer-org-0-cert.pem
    server-name: 127.0.0.1

remote-orchestrator-resolver:
  dynamic:
    msp-ids:
      - org-0
    endpoint:
      host: 127.0.0.1
      port: 9300
    tls:
      mode: mtls
      cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
      key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
      ca-cert-paths:
        - ../artifacts/peerOrganizations/peer-org-0/tlsca/tlsca.peer-org-0-cert.pem
      server-name: 127.0.0.1
    contact-tls:
      mode: mtls
      cert-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.crt
      key-path: ../artifacts/peerOrganizations/peer-org-1/peers/orchestrator1.peer-org-1/tls/server.key
      ca-cert-paths:
        - ../artifacts/peerOrganizations/peer-org-0/tlsca/tlsca.peer-org-0-cert.pem
      server-name: 127.0.0.1
